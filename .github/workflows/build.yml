name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Android project
        run: flutter create --platforms=android temp_app

      - name: Copy app source into scaffold
        run: |
          cp -r lib/. temp_app/lib/
          cp pubspec.yaml temp_app/pubspec.yaml

      - name: Get dependencies
        working-directory: temp_app
        run: flutter pub get

      - name: Build APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novaplan-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
